[project]
name = "jp-doc-agent"
version = "0.1.0"
description = "A Japanese document research agent built on public datasets."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "httpx>=0.28,<1",
    "pdfminer-six>=20251230",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "pypdf[crypto]>=6,<7",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
jp-doc-agent = "jp_doc_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_doc_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
